##
## Frontend (SPA) routing + static assets
##
## Important:
## - Vite builds emit hashed assets under /assets
## - If /assets is not served as static, Nginx falls back to /index.html and
##   browsers fail with: "Expected a JavaScript module script but got text/html".
##

# Serve Vite hashed assets as real files (never fall back to index.html)
location ^~ /assets/ {
    try_files $uri =404;
    include include.d/allcache.conf;
}

# Backwards compat (some older builds may emit /static)
location ^~ /static/ {
    try_files $uri =404;
    include include.d/allcache.conf;
}

# Common root assets
location = /favicon.ico { try_files $uri =404; include include.d/allcache.conf; }
location = /manifest.webmanifest { try_files $uri =404; include include.d/allcache.conf; }
location = /robots.txt { try_files $uri =404; include include.d/allcache.conf; }

# SPA fallback
location / {
    try_files $uri $uri/ /index.html;
    include include.d/nocache.conf;
}

include "include.d/spa.conf";
