name: Sync vehicles (Supabase -> Railway) [DESACTIVADO]

# El sistema ahora lee vehicles directo de Supabase via SUPABASE_DATABASE_URL.
# El sync ya no es necesario. Workflow desactivado — solo disponible manualmente
# por si se necesita una migración puntual de emergencia.
on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/panel-whaticket/backend/package.json

      - name: Debug versions & paths
        run: |
          node -v
          npm -v
          ls -la
          ls -la apps/panel-whaticket/backend || true
          ls -la apps/panel-whaticket/backend/scripts || true

      - name: Install deps (backend) - npm install
        working-directory: apps/panel-whaticket/backend
        run: |
          npm install --no-audit --no-fund
          npm install pg --no-audit --no-fund

      - name: Run sync vehicles
        working-directory: apps/panel-whaticket/backend
        env:
          NODE_TLS_REJECT_UNAUTHORIZED: "0"
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          RAILWAY_DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
          NODE_ENV: production
        run: node scripts/syncVehicles.mjs