name: Sync vehicles (Supabase -> Railway)

on:
  schedule:
    # GitHub Actions uses UTC. Argentina is UTC-3.
    # 06:10 UTC ~= 03:10 America/Argentina/Buenos_Aires
    - cron: "10 6 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/panel-whaticket/backend/package.json

      - name: Debug versions & paths
        run: |
          node -v
          npm -v
          ls -la
          ls -la apps/panel-whaticket/backend || true
          ls -la apps/panel-whaticket/backend/scripts || true

      - name: Install deps (backend) - npm install
        working-directory: apps/panel-whaticket/backend
        run: |
          npm install --no-audit --no-fund
          npm install pg --no-audit --no-fund

      - name: Run sync vehicles
        working-directory: apps/panel-whaticket/backend
        env:
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          RAILWAY_DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
          NODE_ENV: production
        run: node scripts/syncVehicles.mjs